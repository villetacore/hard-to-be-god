[package]
name = "hard-to-be-god"
version = "0.1.0"
edition = "2024"
description = "Veligrad: a first-person social simulation with local AI-driven citizens"
license = "MIT"
repository = "https://github.com/villetacore/hard-to-be-god"
readme = "README.md"
publish = false

[dependencies]
macroquad = "0.4.14"
tobj = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

